# Blueprint do Render: cria o serviço web que compila o front-end e roda a API.
services:
  - type: web
    name: rk-info-games-gerenciamento
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
